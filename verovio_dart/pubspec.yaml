name: verovio_dart
description: >-
  Dart port of Verovio 6.2, a library for engraving music notation from MEI,
  MusicXML and ABC into SVG. Functional equivalent of the C++ original.
version: 0.0.1
homepage: https://example.com

environment:
  sdk: ^3.0.0

dependencies:
  xml: ^6.5.0
  archive: ^4.0.0
  meta: ^1.15.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

# Data resources (SMuFL fonts etc.) are shipped inside the package and
# resolved at runtime relative to the package root.
